<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados</title>
<link rel="stylesheet" href="comun/fuentes/geist.css?v=3">
<link rel="stylesheet" href="comun/base.css?v=5">
<link rel="stylesheet" href="comun/paneles.css?v=1">
<link rel="stylesheet" href="horario/semana.css?v=1">
<link rel="stylesheet" href="resultados/resultados.css?v=5">
</head>
<body>
<div class="lienzo">
  <div class="mancha mancha-izq" aria-hidden="true"></div>
  <div class="mancha mancha-der" aria-hidden="true"></div>

  <nav class="riel vidrio" aria-label="Pasos" id="riel"></nav>

  <main class="principal">
    <header class="encabezado">
      <h1 id="titulo">Resultados</h1>
      <p id="subtitulo">Cargando la ejecución…</p>
    </header>

    <div class="cuerpo" id="cuerpo">
      <section class="escenario" aria-label="Espacio de búsqueda" id="escenario">
        <img class="mapa-imagen" id="mapa-imagen" alt="" hidden>
        <canvas class="mapa-lienzo" id="mapa"></canvas>
        <ul class="leyenda" id="leyenda" hidden>
          <li><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#D95319" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/></svg>mejor solución</li>
          <li><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="rgba(255, 255, 255, 0.45)" stroke="rgba(17, 19, 40, 0.45)" stroke-width="2"/></svg><span id="leyenda-inicio"></span></li>
          <li><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h20" stroke="#111113" stroke-width="2" stroke-dasharray="3 3"/></svg>ruta del mejor</li>
        </ul>
      </section>

      <section class="tarjeta escena-horario" aria-label="Horario final" id="escena-horario" hidden>
        <div class="escena-cabeza">
          <div>
            <span class="etiqueta" id="horario-etiqueta"></span>
            <h2 class="escena-titulo" id="horario-titulo"></h2>
          </div>
          <ul class="leyenda-semana" id="horario-leyenda"></ul>
        </div>
        <div class="semana" id="horario-semana"></div>
        <div class="bits-pie">
          <div class="bits-cabeza">
            <span class="etiqueta">La solución como bits</span>
            <span class="nota" id="bits-nota"></span>
          </div>
          <div class="bits" id="bits" role="img"></div>
        </div>
      </section>

      <div class="columna">
        <section class="tarjeta lecturas" aria-label="Resumen">
          <div class="lectura">
            <span class="etiqueta" id="etiqueta-mejor">Mejor f</span>
            <span class="grande" id="mejor">–</span>
            <span class="nota" id="sentido"></span>
          </div>
          <div class="lectura solo-mapa">
            <span class="etiqueta" id="etiqueta-solucion">Mejor solución</span>
            <span class="mediana" id="solucion">–</span>
            <span class="nota" id="optimo"></span>
          </div>
          <div class="lectura al-final solo-mapa">
            <span class="etiqueta">Iteraciones</span>
            <span class="grande" id="iteraciones">–</span>
            <span class="nota" id="motivo"></span>
          </div>
          <div class="lectura solo-horario">
            <span class="etiqueta">Choques</span>
            <span class="grande" id="choques">–</span>
          </div>
          <div class="lectura solo-horario">
            <span class="etiqueta">Horas muertas</span>
            <span class="grande" id="muertas">–</span>
          </div>
          <p class="resumen-f solo-horario" id="resumen-f"></p>
        </section>

        <section class="tarjeta nrc solo-horario" aria-labelledby="titulo-nrc">
          <div class="nrc-cabeza">
            <h2 id="titulo-nrc">NRC para SIIAU</h2>
            <button type="button" class="boton boton-chico" id="copiar-nrc">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16"/></svg>
              Copiar NRC
            </button>
          </div>
          <ul class="lista-nrc" id="lista-nrc"></ul>
          <p class="nota" id="nota-nrc"></p>
        </section>

        <section class="tarjeta detalle" aria-label="Detalle">
          <div class="pestanas" role="tablist" aria-label="Detalle de la ejecución">
            <button type="button" role="tab" id="tab-convergencia" aria-controls="panel-convergencia" aria-selected="true">Convergencia</button>
            <button type="button" role="tab" id="tab-historial" aria-controls="panel-historial" aria-selected="false" tabindex="-1">Historial</button>
            <button type="button" role="tab" id="tab-configuracion" aria-controls="panel-configuracion" aria-selected="false" tabindex="-1">Configuración</button>
          </div>

          <div class="panel" role="tabpanel" id="panel-convergencia" aria-labelledby="tab-convergencia">
            <div class="convergencia"><svg id="convergencia" role="img" aria-label="Convergencia del mejor valor"></svg></div>
          </div>
          <div class="panel" role="tabpanel" id="panel-historial" aria-labelledby="tab-historial" hidden>
            <div class="desplazable">
              <table class="historial">
                <thead><tr><th>Iteración</th><th id="th-valor">Mejor f</th><th id="th-solucion">Mejor solución</th></tr></thead>
                <tbody id="historial"></tbody>
              </table>
            </div>
            <p class="nota" id="nota-historial"></p>
          </div>
          <div class="panel" role="tabpanel" id="panel-configuracion" aria-labelledby="tab-configuracion" hidden>
            <div class="desplazable">
              <dl class="configuracion-lista" id="configuracion"></dl>
            </div>
          </div>
        </section>
      </div>
    </div>

    <section class="acciones vidrio" aria-label="Acciones">
      <div role="status" id="estado"></div>
      <div class="acciones-botones">
        <button type="button" class="boton" id="exportar-csv">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>
          CSV
        </button>
        <button type="button" class="boton" id="exportar-json">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>
          JSON
        </button>
        <button type="button" class="boton" id="nueva-ejecucion" title="Volver al algoritmo con la misma configuración para correr otra">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
          Nueva ejecución
        </button>
        <button type="button" class="boton boton-primario" id="comparar">
          Comparar ejecuciones
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>
  </main>
</div>

<script src="comun/puente.js?v=3"></script>
<script src="comun/riel.js?v=5"></script>
<script src="comun/graficas.js?v=3"></script>
<script src="horario/texto.js?v=2"></script>
<script src="horario/semana.js?v=1"></script>
<script src="horario/elegido.js?v=1"></script>
<script src="horario/demo.js?v=2"></script>
<script src="ejecucion/demo.js?v=3"></script>
<script src="resultados/demo.js?v=2"></script>
<script src="resultados/resultados.js?v=7"></script>
</body>
</html>
